<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Black rose petals falling in the wind">
<style>
  .fall, .drift, .spin, .flip { transform-origin: 0 0; will-change: transform; }
  .fall  { animation: fall var(--dur) linear var(--delay) infinite; }
  .drift { animation: var(--gust) var(--dur) ease-in-out var(--delay) infinite; }
  .spin  { animation: var(--spinDir) var(--spinDur) linear var(--delay) infinite; }
  .flip  { animation: flip var(--flipDur) ease-in-out var(--delay) infinite; }

  @keyframes fall { from { transform: translateY(-90px); } to { transform: translateY(890px); } }

  /* Drift paths: steady diagonal drift interrupted by short wind hiccups
     (a quick push sideways with a small lift), then a settle-back. */
  @keyframes gustA {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(calc(var(--d) * 0.16), 0); }
    26%  { transform: translate(calc(var(--d) * 0.34), calc(var(--l) * -1)); }
    32%  { transform: translate(calc(var(--d) * 0.31), calc(var(--l) * -0.4)); }
    58%  { transform: translate(calc(var(--d) * 0.50), 0); }
    63%  { transform: translate(calc(var(--d) * 0.70), calc(var(--l) * -0.8)); }
    70%  { transform: translate(calc(var(--d) * 0.66), calc(var(--l) * -0.2)); }
    100% { transform: translate(var(--d), 0); }
  }
  @keyframes gustB {
    0%   { transform: translate(0, 0); }
    38%  { transform: translate(calc(var(--d) * 0.30), 0); }
    43%  { transform: translate(calc(var(--d) * 0.52), calc(var(--l) * -1.2)); }
    50%  { transform: translate(calc(var(--d) * 0.47), calc(var(--l) * -0.3)); }
    80%  { transform: translate(calc(var(--d) * 0.74), 0); }
    84%  { transform: translate(calc(var(--d) * 0.86), calc(var(--l) * -0.5)); }
    100% { transform: translate(var(--d), 0); }
  }
  @keyframes gustC {
    0%   { transform: translate(0, 0); }
    12%  { transform: translate(calc(var(--d) * 0.10), 0); }
    17%  { transform: translate(calc(var(--d) * 0.24), calc(var(--l) * -0.7)); }
    24%  { transform: translate(calc(var(--d) * 0.20), 0); }
    46%  { transform: translate(calc(var(--d) * 0.36), 0); }
    50%  { transform: translate(calc(var(--d) * 0.40), 0); }
    74%  { transform: translate(calc(var(--d) * 0.58), 0); }
    79%  { transform: translate(calc(var(--d) * 0.80), calc(var(--l) * -1.1)); }
    86%  { transform: translate(calc(var(--d) * 0.78), calc(var(--l) * -0.3)); }
    100% { transform: translate(var(--d), 0); }
  }

  @keyframes spinCW  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spinCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

  /* Fake 3D tumble: squash through edge-on and show the mirrored back side. */
  @keyframes flip {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(0.12, 0.92); }
    50%  { transform: scale(-1, 1); }
    75%  { transform: scale(0.12, 0.92); }
    100% { transform: scale(1, 1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fall, .drift, .spin, .flip { animation-play-state: paused; }
  }
</style>
<defs>
    <radialGradient id="petalFill" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="0.35" stop-color="#161616"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
